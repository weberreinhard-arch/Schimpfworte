<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Begriffe</title>
  <style>
    body {
      background-color: #fff8e7;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      font-family: sans-serif;
    }
    h1 {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }
    h2 {
      font-size: 28px;
      font-weight: normal;
      text-align: center;
      margin: 5px 0 20px 0;
    }
    .term {
      position: absolute;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .translation {
      opacity: 0.4;
      margin-left: 8px;
    }
    /* Button unten links */
    #shuffleBtn {
      position: fixed;
      bottom: 60px;
      left: 20px;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #e0c080;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }
    #shuffleBtn:hover {
      background-color: #d0a060;
    }
    /* Logo oben rechts */
    #logo {
      position: fixed;
      top: 20px;
      right: 10px;
      height: 70px;
      max-width: 120px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }
    /* Fußzeile */
    footer {
      position: fixed;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
    .copyright {
      position: fixed;
      bottom: 5px;
      right: 10px;
      font-size: 12px;
      color: #222;
      background: rgba(255,255,255,0.8);
      padding: 2px 6px;
      border-radius: 4px;
    }
    /* Mobile Anpassung */
    @media (max-width: 600px) {
      .copyright {
        font-size: 13px;
        color: #000;
        background: #fff;
      }
      footer {
        font-size: 16px;
      }
      #logo {
        height: 80px;   /* etwas größer auf Handy */
        max-width: 140px;
      }
      #shuffleBtn {
        font-size: 16px;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>

  <h1>Goddelsheims Platt</h1>
  <h2>- schimpfen und charakterisieren -</h2>

  <!-- Button unten links -->
  <button id="shuffleBtn">Neu mischen</button>

  <!-- Logo -->
  <img id="logo" src="logo.jpg" alt="Logo">

  <!-- Fußzeile -->
  <footer>Klicken und hören!</footer>
  <div class="copyright">copyright Kultuverein Goddelsheim</div>

<script>
  const terms = [
    ["Dunnerkiil","=Tausendsassa"],
    ["Dräumekeuze","=Tranfunzel, Trantüte"],
    ["Düstergroet","=eine Frau die böse guckt"],
    ["Geschüggele","=Vogelscheuche"],
    ["Halsaffschniider","=Halunke"],
    ["Kalfmoses","=ungeschickter Mensch"],
    ["Klimfiister","=Kleinigkeitskrämer"],
    ["Kloobes","=Trottel/Dummkopf"],
    ["Knispel","=Genauigkeitsfanatiker"],
    ["Kröddel","=Miesepeter"],
    ["Schingeoas","=schlechter Mensch"],
    ["Schmoalääs","=hagerer Mensch"],
    ["Stiifläedder","=unsportlicher, ungelenker Mensch"],
    ["Suggelatz","=Dreckschwein"],
    ["Suggerump","=Schweinerumpf, Schimpfwort"],
    ["Wöstemichel","=ungehobelter Kerl"],
    ["Bloosenkopp","=Dummkopf"],
    ["Hospes","=Trottel"]
  ];

  const fonts = ["Arial","Courier New","Georgia","Verdana","Times New Roman","Tahoma","Impact","Comic Sans MS","Helvetica"];
  const colors = ["darkred","blue","green","purple","darkorange","brown","teal","crimson","navy","darkgreen","indigo","darkblue","maroon","olive","darkcyan","darkmagenta","darkslateblue","firebrick"];

  const placed = [];
  let isPlaying = false;

  function overlaps(x,y,w,h) {
    return placed.some(p => !(x+w < p.x || p.x+p.w < x || y+h < p.y || p.y+p.h < y));
  }

  function placeTerms() {
    placed.length = 0;
    const topMargin = 160;
    const bottomMargin = 140;

    document.querySelectorAll(".term").forEach(div => {
      const rect = div.getBoundingClientRect();
      let w = rect.width;
      let h = rect.height;

      let x,y,tries=0;
      do {
        x = Math.random()*(window.innerWidth - w);
        y = topMargin + Math.random()*(window.innerHeight - h - topMargin - bottomMargin);
        tries++;
        if (tries>1000) break;
      } while(overlaps(x,y,w,h));

      div.style.left = x + "px";
      div.style.top = y + "px";
      placed.push({x,y,w,h});
    });
  }

  // Begriffe erzeugen
  terms.forEach(([word,translation]) => {
    const div = document.createElement("div");
    div.className = "term";

    const baseSize = (window.innerWidth < 600 ? 16 : 20) + Math.random()*12;
    div.style.fontSize = (baseSize*1.2) + "px";
    div.style.fontFamily = fonts[Math.floor(Math.random()*fonts.length)];
    div.style.color = colors[Math.floor(Math.random()*colors.length)];
    div.innerHTML = word + "<span class='translation'>" + translation + "</span>";
    document.body.appendChild(div);

    const playAudio = () => {
      if (isPlaying) return;
      new Audio("click.mp3").play();
      const audio = new Audio(word + ".mp3");
      isPlaying = true;
      audio.play();

      // kleine Animation
      div.style.transform = "scale(1.3)";
      div.style.color = "gold";
      setTimeout(() => {
        div.style.transform = "scale(1)";
        div.style.color = colors[Math.floor(Math.random()*colors.length)];
      }, 300);

      audio.onended = () => { isPlaying = false; };
    };

    div.onclick = playAudio;
    div.ontouchstart = playAudio;
  });

  // Initial platzieren
  placeTerms();

  // Neu platzieren bei Fensteränderung
  window.addEventListener("resize", () => {
    placeTerms();
  });

  // Button zum Neu mischen
  document.getElementById("shuffleBtn").onclick = () => {
    placeTerms();
  };
</script>

</body>
</html>
