<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Begriffe</title>
  <style>
    body {
      background-color: #fff8e7;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100%;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
      padding-right: 140px; /* Platz für Logo */
    }
    h2 {
      font-size: 28px;
      font-weight: normal;
      text-align: center;
      margin: 5px 0 10px 0;
      padding-right: 140px; /* Platz für Logo */
    }
    #termsContainer {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-content: flex-start;
      padding: 20px;
      overflow-y: auto;
    }
    .term {
      flex: 1 0 200px;
      margin: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
      position: relative;
      line-height: 1.5;
    }
    .translation {
      opacity: 0.6;
      margin-left: 8px;
      font-size: 0.7em;
    }

    /* Logo oben rechts */
    #logo {
      position: absolute;
      top: 20px;
      right: 20px;
      height: 70px;
      max-width: 120px;
      background: #fff;
      padding: 4px;
      border-radius: 6px;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }

    /* Fußzeile */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: bold;
      gap: 30px; /* Abstand zwischen den Elementen */
    }
    #shuffleBtn {
      font-size: 16px;
      background-color: #e0c080;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      padding: 8px 16px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }
    #shuffleBtn:hover { background-color: #d0a060; }
    .copyright {
      font-size: 12px;
      color: #222;
    }

    /* Handy */
    @media (max-width: 600px) {
      .term {
        font-size: 20px;
        white-space: normal;
        flex: 1 0 140px;
      }
      #logo { height: 60px; max-width: 100px; }
      #shuffleBtn { font-size: 14px; padding: 6px 12px; }
      h1, h2 { padding-right: 110px; } /* etwas weniger Platz auf kleinen Screens */
    }

    /* Tablet */
    @media (min-width: 601px) and (max-width: 1024px) {
      .term { font-size: 22px; }
      #logo { height: 80px; max-width: 140px; }
    }
  </style>
</head>
<body>

  <h1>Goddelsheims Platt</h1>
  <h2>- schimpfen und charakterisieren -</h2>

  <img id="logo" src="logo.jpg" alt="Logo">

  <div id="termsContainer"></div>

  <footer>
    <button id="shuffleBtn">Neu mischen</button>
    <div>Klicken und hören!</div>
    <div class="copyright">© Kulturverein Goddelsheim</div>
  </footer>

<script>
  const terms = [
    ["Dunnerkiil","=Tausendsassa"],
    ["Dräumekeuze","=Tranfunzel, Trantüte"],
    ["Düstergroet","=eine Frau die böse guckt"],
    ["Geschüggele","=Vogelscheuche"],
    ["Halsaffschniider","=Halunke"],
    ["Kalfmoses","=ungeschickter Mensch"],
    ["Klimfiister","=Kleinigkeitskrämer"],
    ["Kloobes","=Trottel/Dummkopf"],
    ["Knispel","=Genauigkeitsfanatiker"],
    ["Kröddel","=Miesepeter"],
    ["Schingeoas","=schlechter Mensch"],
    ["Schmoalääs","=hagerer Mensch"],
    ["Stiifläedder","=unsportlicher, ungelenker Mensch"],
    ["Suggelatz","=Dreckschwein"],
    ["Suggerump","=Schweinerumpf, Schimpfwort"],
    ["Wöstemichel","=ungehobelter Kerl"],
    ["Bloosenkopp","=Dummkopf"],
    ["Hospes","=Trottel"]
  ];

  const fonts = ["Arial","Courier New","Georgia","Verdana","Times New Roman","Tahoma","Impact","Comic Sans MS","Helvetica"];
  const colors = ["darkred","blue","green","purple","darkorange","brown","teal","crimson","navy","darkgreen","indigo","darkblue","maroon","olive","darkcyan","darkmagenta","darkslateblue","firebrick"];

  let isPlaying = false;

  function shuffleArray(arr) {
    return arr
      .map(value => ({ value, sort: Math.random() }))
      .sort((a, b) => a.sort - b.sort)
      .map(({ value }) => value);
  }

  function createTerms() {
    const container = document.getElementById("termsContainer");
    container.innerHTML = "";

    const shuffled = shuffleArray(terms);

    shuffled.forEach(([word,translation]) => {
      const div = document.createElement("div");
      div.className = "term";

      const baseSize = Math.max(
        window.innerWidth < 600 ? 18 : 14,
        window.innerWidth / 50
      ) + Math.random()*8;
      div.style.fontSize = baseSize + "px";
      div.style.fontFamily = fonts[Math.floor(Math.random()*fonts.length)];
      div.style.color = colors[Math.floor(Math.random()*colors.length)];
      div.innerHTML = word + "<span class='translation'>" + translation + "</span>";

      const dx = Math.random()*20 - 10;
      const dy = Math.random()*20 - 10;
      div.style.transform = `translate(${dx}px, ${dy}px)`;

      const playAudio = () => {
        if (isPlaying) return;
        new Audio("click.mp3").play();
        const audio = new Audio(word + ".mp3");
        isPlaying = true;
        audio.play();

        div.style.transform += " scale(1.3)";
        div.style.color = "gold";
        setTimeout(() => {
          div.style.transform = `translate(${dx}px, ${dy}px) scale(1)`;
          div.style.color = colors[Math.floor(Math.random()*colors.length)];
        }, 300);

        audio.onended = () => { isPlaying = false; };
      };

      div.onclick = playAudio;
      div.ontouchstart = playAudio;

      container.appendChild(div);
    });
  }

  createTerms();

  document.getElementById("shuffleBtn").onclick = () => {
    createTerms();
  };

  window.addEventListener("resize", () => {
    createTerms();
  });
</script>

</body>
</html>
